apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scratch-retry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexbalda/alert-triage-scratch
    path: deploy/argocd/apps/scratch-retry
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: scratch-retry
